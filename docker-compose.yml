services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:15
    container_name: matcha_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Backend (Node/Express) ---
  server:
    build: ./server
    container_name: matcha_server
    restart: always
    ports:
      - '5000:5000'
    volumes:
      - ./server:/usr/src/app
      # Anonymous volume to isolate container node_modules from host
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_SECURE=${EMAIL_SECURE}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - CLIENT_URL=${CLIENT_URL}

  # --- Frontend (React/Vite) ---
  client:
    build: ./client
    container_name: matcha_client
    restart: always
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      # Anonymous volume to isolate container node_modules from host
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  # --- Database GUI ---
  adminer:
    image: adminer
    restart: always
    ports:
      - '8080:8080'
